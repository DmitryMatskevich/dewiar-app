    # =================================================================
    # DEWIAR STT — распознавание речи для приложений: https://dewiar.pro/stt/v1/audio/transcriptions
    # Вставить в server { … } nginx.conf рядом с блоком /mnote/.
    # =================================================================
    location ^~ /stt/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stt_upstream http://dewiar-stt:8020;
        rewrite ^/stt/(.*)$ /$1 break;
        proxy_pass $stt_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 30M;
        proxy_read_timeout 120s;
    }

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dewiar</title>
<link href="assets/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="assets/skins.css">
<style>
  /* Виджет — матово-чёрная карточка; в ней живёт персонаж. Окно непрозрачное, скругление даёт форма окна,
     тень рисует система. Режим «значок» — отдельное круглое окно с той же страницей (?mode=mini).
     С ядром страница говорит сама (core из assets/dewiar.js), окнами управляет ui/app.py (api() — класс Api:
     положение, режим, трей, студия, окно напоминания). Сторож загрузки в app.py (page_guard) ищет #card, #orb
     и window.core — без них виджет сочтут незагрузившимся и спрячут. */
  :root { --persona: #8A9BFF; --ink: #F4F4F6; --muted: rgba(255,255,255,.62);
          /* сдержанная палитра (фирменные цвета владельца): стекло вместо фиолетовых заливок, акцент — холодный белый */
          --brand: linear-gradient(135deg, rgba(255,255,255,.22) 0%, rgba(193,235,255,.13) 100%);
          --glass: rgb(255 255 255 / 4%); --glass-shadow: 0 0 20px rgba(0,0,0,.5); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0b0e; overflow: hidden; height: 100%; user-select: none; -webkit-user-select: none; }
  body { font: 14px/1.45 "Manrope", "Ubuntu", "Noto Sans", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  #card { position: absolute; inset: 0; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; padding: 10px 14px 12px; cursor: grab;
          background: #0a0a0f; background: var(--skin-bg, #0a0a0f); }   /* тема — assets/skins.css (класс skin-… у body) */
  #card.dragging { cursor: grabbing; }
  /* Linux с композитором (ui/app.py composited_x11, &tw=1): окно прозрачное, углы скругляет сама страница — сглаженно,
     без ступенек формы окна (отзыв 19.10: «грубовато края стали» на светлой теме) */
  html.tw, html.tw body { background: transparent; }
  html.tw #card { border-radius: 28px; }
  /* Светлые темы: карточка сливалась со светлым окном под ней (студия в «Небесном», 20.10). Тени внутри (материал,
     портрет, панель) не трогаем — только сама карточка: тонкая линия по краю и светлый блик сверху, во всё окно.
     Было (0.38.94): в прозрачном окне тень снаружи и 6 px пустого края под неё — пока виджет тянули, Ubuntu закрашивал
     этот край тёмным фоном окна («тёмная кромка»). Пустого края больше нет — нечего закрашивать; отрисовку окна (GTK)
     не трогаем (0.38.95: правка фона окна заморозила виджет). */
  body.light:not(.mini) #card { box-shadow: inset 0 0 0 1px rgba(20,32,60,.075), inset 0 1px 0 rgba(255,255,255,.6); }   /* 20.10: «чуть менее заметную» — .13 → .075 */
  /* растянуть карточку за угол (отзыв 19.10); размер запоминается (ui.hud_w, ui.hud_h) */
  #grip { position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; z-index: 6; cursor: nwse-resize;
          display: grid; place-items: center; opacity: 0; transition: opacity .2s; color: var(--muted); touch-action: none; }
  html.tw #grip { right: 7px; bottom: 7px; }
  #card:hover #grip, #grip.on { opacity: .75; }
  #grip svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  body.mini #grip { display: none; }
  /* Темы (ui.skin, студия → «Оформление»): фон и стекло — в assets/skins.css; здесь только то, что меняет «Неон»
     сверх фона: фиолетовые кнопки и заливка строки состояния, как раньше */
  body.skin-neon { --brand: linear-gradient(135deg, #667eea 0%, #764ba2 100%); --glass: rgba(255,255,255,.065); --glass-shadow: 0 0 0 transparent; }
  body.skin-neon #bubble.live { background: var(--brand); }
  /* Светлые темы (body.light — skins.js light): тёмный текст, кнопки-акценты — глубокий чернильный, как в дизайн-студиях */
  body.light { --brand: linear-gradient(135deg, #2b2540 0%, #3b3560 100%); }
  body.light #bubble { color: var(--ink); }
  body.light #bubble::before { background: rgba(30,30,50,.25); }
  body.light #bubble.live::before { background: var(--ink); box-shadow: none; }
  body.light #bubble::after { background: linear-gradient(90deg, transparent, rgba(30,30,60,.55) 25%, rgba(30,30,60,.75) 50%, rgba(30,30,60,.55) 75%, transparent); }
  body.light #cap .bot.wait::before, body.light #cap .bot.wait::after, body.light #cap .bot.wait i { background: var(--ink); }
  body.light #cap .bot::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); }
  body.light #bot .rep, body.light #yn button:not(.yes), body.light #team-list button.cur { background: rgba(20,20,40,.07); color: var(--ink); }
  body.light #act, body.light #task, body.light #upd:not(.on), body.light #health, body.light #cloudlow { color: var(--ink); }
  body.light .btn:hover, body.light .btn:focus-visible, body.light #corner .btn:hover, body.light #corner-r .btn:hover, body.light .ab:hover { color: var(--ink); background: rgba(20,20,40,.07); }
  body.light #corner .btn, body.light #corner-r .btn, body.light #corner-l .btn { color: var(--muted); }
  body.light #team { background: #fff; color: var(--ink); box-shadow: 0 14px 40px rgba(20,30,60,.18), 0 0 0 100vmax rgba(20,30,60,.12); }
  body.light #team-list button:hover, body.light #team-list button:focus-visible { background: rgba(20,20,40,.05); }
  body.light .team-close { background: rgba(20,20,40,.07); color: var(--muted); }
  body.light .sep { background: rgba(20,20,40,.12); }
  body.light #ask textarea { color: var(--ink); }
  body.light #ask textarea::placeholder { color: var(--muted); }
  /* карточки напоминания, заметки, расхода и таймера (отзыв 18.10: в «Небесном» белые цифры и янтарная строка на светлом
     почти не читались) — на светлом: свой тон фона, тёмный текст, акценты темнее, кнопки — как остальные светлые */
  body.light #rem { background: linear-gradient(135deg, rgba(255,181,71,.2), rgba(255,106,136,.12)); box-shadow: 0 8px 22px rgba(20,30,60,.10); color: var(--ink); }
  body.light #rem.note { background: linear-gradient(135deg, rgba(138,155,255,.2), rgba(75,227,161,.12)); }
  body.light #rem .rt b { color: #9a5a00; }
  body.light #rem.note .rt b { color: #3d4bb8; }
  body.light #rem.money .rt b { color: #1f7a55; }
  body.light #rem button, body.light #tmr button { background: rgba(20,20,40,.08); color: var(--ink); }
  body.light #rem button:hover, body.light #tmr button:hover { background: rgba(20,20,40,.14); }
  body.light #tmr .tr { background: linear-gradient(135deg, rgba(126,232,250,.22), rgba(138,155,255,.16)); box-shadow: 0 8px 22px rgba(20,30,60,.10); }
  body.light #tmr .tr.end { background: linear-gradient(135deg, rgba(255,181,71,.28), rgba(255,106,136,.18)); }
  body.light #tmr .tt b { color: var(--ink); }
  body.light #tmr .tt span { color: var(--muted); }
  body.light #tmr svg.pg .bg { stroke: rgba(20,20,40,.10); }
  body.light #tmr svg.pg .fg { stroke: #2aa7c9; }
  body.light #tmr .tr.end svg.pg .fg { stroke: #e08a00; }
  /* неоморфизм: портрет — выпуклая «таблетка» из того же материала (две тени вокруг круга под обликом) */
  body.neu #orb::before { content: ""; position: absolute; left: 50%; top: 50%; width: 63%; height: 63%; transform: translate(-50%, -50%);
                         border-radius: 50%; background: var(--glass); box-shadow: 9px 9px 18px var(--neu-dark), -9px -9px 18px var(--neu-light); }
  body.neu.light #orb::before { width: 72%; height: 72%; }      /* светлый неоморфизм: поле материала вокруг портрета, без рамки */
  body.neu #orb canvas { position: relative; }
  body.neu .btn:hover, body.neu .ab:hover { background: transparent; box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); }
  body.neu #bar { opacity: .9; }
  /* как в наборах неоморфизма: поле ввода — вогнутое, акцент — чистый синий (точка «слушаю», черта «ваша очередь», кнопки) */
  body.neu { --brand: linear-gradient(135deg, #6a8dff 0%, #4f6cf0 100%); --accent: #5b7cff; }
  body.neu .askbox, body.neu .askbox:focus-within { background: var(--glass); box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); }
  body.neu #bubble.live::before { background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent); }
  body.neu #bubble::after { background: linear-gradient(90deg, transparent, var(--accent) 25%, #7fd6ff 50%, var(--accent) 75%, transparent); }
  body.neu #yn button:not(.yes) { background: var(--glass); box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  body.neu #team { background: var(--glass); box-shadow: 8px 8px 20px var(--neu-dark), -8px -8px 20px var(--neu-light); }

  #orb { position: relative; width: calc(228px * var(--ok, 1)); height: calc(228px * var(--ok, 1)); flex: none; margin-top: 38px; cursor: pointer; transition: width .35s ease, height .35s ease, opacity .2s; }
  #card.busy #orb { width: calc(150px * var(--ok, 1)); height: calc(150px * var(--ok, 1)); }        /* есть текст — сфера уступает место */
  #card.no-orb #orb { display: none; }
  #orb canvas { width: 100%; height: 100%; display: block; }

  /* Строка состояния под портретом — не кнопка: стекло, слева точка. Слушает, думает, говорит — точка светится и
     дышит. «Ваша очередь» (ответ закончен, можно говорить без имени) — под надписью тонкая светлая черта тает к центру:
     столько осталось ждать; кончилась — снова покой и сигнал «не слушаю». */
  #bubble { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 4; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--glass); box-shadow: var(--glass-shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            color: #fff; border: 0; border-radius: 999px; padding: 6px 18px 8px 14px; min-width: 150px; max-width: min(72%, 300px); font: inherit; font-size: 13.5px; letter-spacing: .01em; cursor: pointer; transition: background .3s, transform .18s; }
  #bubble[hidden] { display: none !important; }
  #bubble:hover, #bubble:focus-visible { transform: translateX(-50%) scale(1.025); outline: none; background: rgba(255,255,255,.12); }
  #bubble::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.28); transition: background .3s, box-shadow .3s; }
  #bubble.live { background: rgb(255 255 255 / 7%); }
  #bubble.live::before { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.75); animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  #bubble > span { position: relative; z-index: 1; }
  #bubble::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 3px; height: 2px; border-radius: 2px;
                   background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75) 20%, rgba(193,235,255,.9) 50%, rgba(255,255,255,.75) 80%, rgba(255,255,255,0));
                   transform: scaleX(0); pointer-events: none; }
  #bubble.turn::after { animation: turn-left var(--turn, 8s) linear forwards; }
  @keyframes turn-left { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { #bubble.turn::after { animation: none; transform: scaleX(.6); } #bubble.live::before { animation: none; } }
  /* диктовка удержанием: красная точка записи и время; увели палец в сторону — «отпустите — отменить» */
  #bubble.hold { background: rgb(255 92 122 / 16%); }
  #bubble.hold::before { background: #ff5c7a; box-shadow: 0 0 10px rgba(255,92,122,.8); animation: breathe 1s ease-in-out infinite; }
  #bubble.hold.holdx { background: rgb(255 255 255 / 7%); }
  #bubble.hold.holdx::before { background: rgba(255,255,255,.5); box-shadow: none; animation: none; }
  #bubble.hold span { font-variant-numeric: tabular-nums; }
  #orb.holding { transform: scale(1.04); transition: transform .2s ease, width .35s ease, height .35s ease; }
  @media (prefers-reduced-motion: reduce) { #bubble.hold::before { animation: none; } #orb.holding { transform: none; } }
  #bubble b { font-family: "Unbounded", "Ubuntu", sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .03em; }

  /* по центру, но не выше имени: при нехватке места «распорки» сжимаются до нуля, а лишнее уходит вниз (не наезжает на имя) */
  #mid { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-start; gap: 8px; padding: 10px 0 8px; overflow: hidden; }
  #card.no-orb #mid { padding-top: 10px; }
  /* Ввод всегда находится над нижней панелью. До появления ответа свободное место — это область
     переписки; при открытом ответе карточка ответа занимает её целиком. */
  #mid::before { content: ""; flex: 0 0 0; min-height: 0; margin: -4px 0; }
  #mid::after { content: ""; display: none; }
  #ask { margin-top: auto; flex: 0 0 auto; min-height: 0; position: relative; z-index: 1; }
  #cap { display: none; flex: 0 1 auto; min-height: 0; width: 100%; overflow: hidden; padding: 10px 13px; border-radius: 18px; background: var(--glass); font-size: calc(13.5px * var(--dw-text, 1)); line-height: 1.42; cursor: default;
         box-shadow: var(--glass-shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #cap.show, #cap.running { display: flex; flex-direction: column; }
  #card.chat-open #cap { flex: 1 1 auto; min-height: 0; }
  #cap #answer-row { display: flex; align-items: flex-start; gap: 8px; flex: 0 1 auto; min-height: 0; }
  #card.chat-open #cap #answer-row { flex: 1 1 auto; }
  #cap #answer-row .bot { flex: 1 1 auto; align-self: stretch; min-width: 0; }
  #cap.running .bot { margin-right: 0; }
  #cap > * { flex: none; }
  #cap.err { background: rgba(255,90,120,.14); }
  #cap .bot:empty:not(.wait) { display: none; }
  /* ответ ещё готовится — три мягко мигающие точки цвета персонажа, а не «…» навсегда */
  #cap .bot.wait { height: 18px; display: flex; gap: 5px; align-items: center; }
  #cap .bot.wait::before, #cap .bot.wait::after, #cap .bot.wait i { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .25; animation: wdot 1.2s infinite ease-in-out; }
  #cap .bot.wait i { animation-delay: .2s; }
  #cap .bot.wait::after { animation-delay: .4s; }
  @keyframes wdot { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
  #cap .you { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #cap .you::before { content: "Вы: "; opacity: .75; }
  /* длинный ответ прокручивается колесом или пальцем; край, за которым есть ещё текст, плавно тает */
  #cap .bot { color: var(--ink); user-select: text; -webkit-user-select: text; white-space: pre-wrap; flex: 0 1 auto; min-height: 0;
              overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; margin-right: -8px; padding-right: 8px;
              scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  #cap .bot::-webkit-scrollbar { width: 4px; } #cap .bot::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 4px; }
  #cap .bot.ft { -webkit-mask-image: linear-gradient(transparent, #000 18px); mask-image: linear-gradient(transparent, #000 18px); }
  #cap .bot.fb { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
  #cap .bot.ft.fb { -webkit-mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 22px), transparent); }
  button.busy, .b.busy { opacity: .55; transform: scale(.94); transition: opacity .15s, transform .15s; }   /* нажатая кнопка ждёт ядро (не вся карточка!) */
  #bot .rep { display: block; margin-top: 8px; border: 0; border-radius: 10px; padding: 5px 10px; font: inherit; font-size: 12px;
             color: #fff; background: rgba(255,255,255,.12); cursor: pointer; }
  #bot .rep:hover { background: rgba(255,255,255,.2); }
  #bot .repask { display: flex; gap: 6px; flex-wrap: wrap; } #bot .repask .rep { display: inline-block; }
  #act { font-size: 12px; color: #D6E4F0; margin-bottom: 4px; display: none; }
  #act.on { display: block; }
  #act.bad { color: #ff8aa2; }
  #act::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; }
  #act.run::before { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #yn { display: none; flex: none; width: 100%; gap: 8px; }
  #yn.on { display: flex; }
  #yn button { flex: 1; padding: 7px 0; border-radius: 12px; border: 0; background: rgba(255,255,255,.1); color: var(--ink); font: inherit; cursor: pointer; }
  #yn button.yes { background: var(--brand); color: #fff; font-weight: 600; }
  /* Статус — отдельная строка в flex-колонке. Без flex-basis и ограничения высоты
     длинная подсказка сжималась до нулевого блока, а текст продолжал рисоваться поверх ответа. */
  #note { flex: 0 1 auto; width: 100%; min-width: 0; min-height: 1.4em; max-height: min(4.2em, 28vh); overflow: auto; overflow-wrap: anywhere;
          text-align: left; font-size: 12.5px; line-height: 1.4; color: var(--muted); padding: 0 8px; cursor: default;
          scrollbar-width: thin; overscroll-behavior: contain; }
  #note:empty, #cap.show ~ #note { display: none; }
  #note { white-space: pre-line; }
  #note:not(:empty) { padding-block: 3px; border-radius: 10px; background: var(--glass); }
  /* первая загрузка: что готовится (status.loading) — полоска под строкой; доля неизвестна — бегущий отрезок */
  #ldbar { display: none; width: 56%; height: 3px; margin: 7px auto 0; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  #ldbar.on { display: block; } #cap.show ~ #ldbar { display: none; }
  #ldbar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(193,235,255,.95)); transition: width .5s; }
  #ldbar.run i { width: 30%; animation: ldrun 1.4s ease-in-out infinite; }
  @keyframes ldrun { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
  #health { display: none; align-self: center; max-width: 100%; text-align: center; font-size: 12px; line-height: 1.35; padding: 5px 11px; border-radius: 12px;
            background: rgba(255,190,90,.14); color: #FFD9A0; cursor: default; }
  #health.on { display: block; } #health.bad { background: rgba(255,107,138,.16); color: #FFC2CF; }
  #health.calm { background: rgba(193,235,255,.08); color: #D6E4F0; }
  #health .dots::after { content: ""; animation: hdots 1.4s steps(4) infinite; }
  @keyframes hdots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  #health button { display: block; margin: 6px auto 0; border: 0; border-radius: 9px; padding: 4px 11px; font: inherit; font-size: 12px; cursor: pointer;
                   background: rgba(255,255,255,.14); color: var(--ink); } #health button:hover { background: rgba(255,255,255,.22); }
  #task, #upd { display: none; text-align: center; font-size: 12px; line-height: 1.35; color: #D6E4F0; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.05); cursor: pointer; }
  #task.on, #upd.on { display: block; }
  #task { text-align: left; padding: 8px 12px; }
  #rem { display: none; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; border-radius: 16px;
         background: linear-gradient(135deg, rgba(255,181,71,.16), rgba(255,106,136,.12)); box-shadow: 0 10px 30px rgb(0 0 0 / 20%); }
  #rem.show { display: flex; animation: remin .35s ease-out; }
  @keyframes remin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #rem.note { background: linear-gradient(135deg, rgba(138,155,255,.16), rgba(75,227,161,.10)); }
  #rem.note .rt b { color: #C9D0FF; }
  #rem .ri { font-size: 18px; }
  #rem .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.3; }
  #rem .rt b { color: #FFC978; font-weight: 600; }
  #rem .rt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #card.long #orb { width: calc(84px * var(--ok, 1)); height: calc(84px * var(--ok, 1)); }          /* длинный текст — сфера уступает место полю */
  #card.long #bubble, #card.long #note, #card.long #cap { display: none; }
  #card.long #cap.show, #card.long #cap.running { display: flex; }
  .ab { flex: none; width: 32px; height: 32px; border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .ab:hover { background: rgba(255,255,255,.09); color: var(--ink); }
  .ab svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ab.send { color: #D6E4F0; }
  #atts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #atts:empty { display: none; }
  .att { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 4px 3px 3px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 11.5px; color: var(--ink); }
  .att img, .att .ic { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; flex: none; }
  .att .ic { display: grid; place-items: center; background: rgba(139,140,247,.25); font-size: 9.5px; font-weight: 600; letter-spacing: .02em; }
  .att span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .att button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 3px; }
  body.drop #card { box-shadow: inset 0 0 0 2px rgba(193,235,255,.35); }

  #bar { flex: 0 0 auto; display: flex; flex-wrap: nowrap; gap: 1px; align-items: center; justify-content: center; padding: 4px 6px; margin-top: 8px; border-radius: 999px; background: var(--glass); box-shadow: var(--glass-shadow); opacity: .6; transition: opacity .2s; cursor: default; position: relative; z-index: 2; }
  #card:hover #bar, #bar.pinned { opacity: 1; }
  .btn { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  #bar .btn { flex: none; width: clamp(24px, calc(12.5vw - 7px), 28px); }
  .btn:hover, .btn:focus-visible { color: #fff; background: rgba(255,255,255,.1); outline: none; }
  .btn.on { color: #ff7a93; }
  .btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #b-voice-inline .x { display: none; } #b-voice-inline.on .x { display: inline; } #b-voice-inline.on .w1 { display: none; }
  .sep { width: 1px; height: 16px; background: rgba(255,255,255,.1); margin: 0 3px; }
  #b-team { width: auto; padding: 0 4px 0 6px; gap: 1px; display: inline-flex; align-items: center; }
  /* кто отвечает — контурный силуэт героини или героя в стиле остальных значков: цветной кружок читался как
     «в сети / не в сети» (тестировщик 14.10), а лицо в 20 px — как пятно рядом с большим портретом (14.10) */
  .gi { display: grid; place-items: center; flex: none; }
  .gi svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #b-team svg.chev { width: 13px; height: 13px; opacity: .7; }
  /* Выбор помощника — отдельное плавающее модальное окно. Оно не отодвигает чат и не зависит от
     количества персонажей: список прокручивается внутри панели, фокус остаётся в окне. */
  #team { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(88%, 360px); max-height: min(72%, 430px);
          overflow: hidden; z-index: 20; display: none; flex-direction: column; padding: 0; border: 1px solid rgba(255,255,255,.13); border-radius: 20px;
          background: #16161c; box-shadow: 0 18px 40px -12px rgba(0,0,0,.8), 0 0 0 100vmax rgba(4,6,14,.32); }
  #team.show { display: flex; animation: tpop .16s ease-out; }
  @keyframes tpop { from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .team-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 10px; flex: none; }
  .team-head b { font-size: 14px; font-weight: 700; letter-spacing: .01em; }
  .team-close { width: 28px; height: 28px; display: grid; place-items: center; flex: none; border: 0; border-radius: 50%; background: rgba(255,255,255,.08); color: var(--muted); cursor: pointer; font: inherit; font-size: 20px; line-height: 1; }
  .team-close:hover, .team-close:focus-visible { color: var(--ink); background: rgba(255,255,255,.16); outline: none; }
  #team-list { min-height: 0; overflow-y: auto; padding: 0 8px 10px; }
  #team-list button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 12px;
                 background: none; color: var(--ink); cursor: pointer; text-align: left; font: inherit; }
  #team-list button:hover, #team-list button:focus-visible { background: rgba(255,255,255,.07); outline: none; }
  #team-list button.cur { background: rgba(255,255,255,.1); }
  #team-list .gi { width: 22px; color: var(--muted); } #team-list button.cur .gi { color: var(--ink); }
  #team-list b { font-weight: 600; font-size: 13px; }
  #team-list span { color: var(--muted); font-size: 11.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  #team-list::-webkit-scrollbar { width: 6px; } #team-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
  .dot { width: 11px; height: 11px; flex: none; border-radius: 50%; border: 0; cursor: pointer; margin: 0 2px; opacity: .45; transition: opacity .2s, transform .2s; }
  .dot:hover { opacity: .9; transform: scale(1.2); }
  .dot.cur { opacity: 1; transform: scale(1.25); }

  /* «свернуть» и «спрятать» — в правом верхнем углу, как у окна; видны, когда мышь над виджетом */
  /* знакомство: подсветка кнопки, о которой сейчас рассказывают; фразы «попробуйте»; «Пропустить» */
  .btn.hl { color: #fff; background: var(--persona); box-shadow: 0 0 0 0 var(--persona); animation: hlp 1.1s ease-out infinite; }
  @keyframes hlp { 0% { box-shadow: 0 0 0 0 var(--persona); } 100% { box-shadow: 0 0 0 9px transparent; } }
  #bot .itry { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  #bot .itry button { text-align: left; border: 0; border-radius: 10px; padding: 6px 10px; font: inherit; font-size: 12.5px; cursor: pointer;
                      color: var(--ink); background: rgba(255,255,255,.08); }
  #bot .itry button::before { content: "▶ "; color: var(--persona); font-size: 10px; }
  #bot .itry button:hover { background: rgba(255,255,255,.15); }
  #intro-skip { position: absolute; top: 10px; left: 12px; z-index: 6; display: none; border: 0; border-radius: 999px; padding: 3px 10px;
                font: inherit; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.07); cursor: pointer; }
  #intro-skip:hover { color: var(--ink); background: rgba(255,255,255,.14); }
  body.intro #intro-skip { display: block; }
  body.mini #intro-skip { display: none !important; }
  #corner, #corner-l, #corner-r { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; opacity: 0; transition: opacity .2s; z-index: 5; }
  #corner-l { right: auto; left: 10px; opacity: 1; }
  /* Управление образом помощника всегда видно в первой строке справа: его не нужно искать наведением. */
  #corner-r { opacity: 1; }
  /* остальные правые действия раскрываются левее постоянной кнопки образа, не перекрывая её. */
  /* Верхние действия виджета доступны сразу после первого запуска, без
     обязательного наведения мыши: повторное открытие не должно менять
     состав панели. */
  #corner { right: 40px; }
  #corner { opacity: 1; }
  #corner[hidden] { display:none; }
  #card:hover #corner, #corner:focus-within, #card:hover #corner-l, #corner-l:focus-within { opacity: 1; }
  #corner .btn, #corner-r .btn, #corner-l .btn { width: 26px; height: 26px; color: rgba(255,255,255,.55); }
  #corner .btn:hover, #corner-r .btn:hover, #corner-l .btn:hover { color: #fff; background: rgba(255,255,255,.1); }
  #corner .btn svg, #corner-r .btn svg, #corner-l .btn svg { width: 15px; height: 15px; }
  #corner.pinned { opacity: 1; }
  #corner-l.lo { opacity: 1; }
  #corner-l.lo #b-lo, body.light #corner-l.lo #b-lo { color: #2fbf83; }
  #corner-l.lo:not(:hover):not(:focus-within) #b-bug { opacity: 0; }
  /* есть обновление — значок виден всегда, с точкой; без него — как жучок, по наведению */
  #corner-l.upd { opacity: 1; } #corner-l.upd:not(:hover):not(:focus-within) #b-bug { opacity: 0; }
  #b-upd { position: relative; } #b-upd.has, body.light #b-upd.has { color: var(--accent, #8B8CF7); }
  #b-upd.has::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: #ff6f9c; box-shadow: 0 0 0 2px rgba(0,0,0,.15); }
  #b-upd.busy svg { animation: updSpin 1.1s linear infinite; } @keyframes updSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #b-upd.busy svg { animation: none; } }                                  /* блокнот открыт — кнопка видна и подсвечена */
  #b-pad.on, #b-play.on { color: var(--accent, #8B8CF7); background: rgba(139,140,247,.14); }
  body.light #b-pad.on, body.light #b-play.on { color: var(--accent, #4f6cf0); background: rgba(79,108,240,.12); }
  /* «Досуг» открывается голосом или из окна блокнота, но не занимает место в первой строке HUD. */
  #corner #b-play { display: none !important; }
  #b-play[hidden] { display: none; }
  #b-orb.on { color: var(--accent, #8B8CF7); background: rgba(139,140,247,.14); }
  /* Legacy input/persona controls stay in the DOM for command compatibility,
     but must never reserve space in the redesigned bottom bar. */
  #bar > [hidden] { display: none !important; }
  body.mini #corner, body.mini #corner-l, body.mini #corner-r { display: none; }

  /* ---------- значок ---------- */
  body.mini #card { padding: 0; justify-content: center; }     /* значок — в той же теме, что и карточка */
  body.mini #orb { width: 92px; height: 92px; }
  body.mini #bubble, body.mini #mid, body.mini #bar, body.mini #ask-model, body.mini #model-menu { display: none; }
  #grow { display: none; position: absolute; left: 62px; top: 62px; width: 24px; height: 24px; border-radius: 50%; border: 0;
          background: rgba(40,40,52,.92); color: #E6E7F2; place-items: center; cursor: pointer; opacity: 0; transition: opacity .2s; }
  #grow svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  body.mini #grow { display: grid; }
  body.mini:hover #grow { opacity: 1; }
  /* «Открыть целиком»: ответ полностью (код — с кнопкой «Копировать») и ход работы — что ассистент делал */
  /* «Ход работы (3) и ответ» — строкой внутри карточки ответа, справа, а не отдельной плашкой между карточками (отзыв
     11.10: на тесном виджете карточка, плашка и задача наезжали друг на друга) */
  #more { display: none; flex: none; align-self: flex-end; margin: 4px -2px -2px 0; border: 0; background: none; color: var(--muted, rgba(255,255,255,.62));
          font: inherit; font-size: 12px; padding: 2px 4px; border-radius: 8px; cursor: pointer; }
  #more::after { content: " ›"; }
  #more.on { display: inline-block; }
  #more:hover { color: var(--ink, #fff); background: rgba(255,255,255,.08); }
  /* тесно (fitCap): вопрос — одной строкой, «…— готово» прячется (о задаче и так говорит карточка задачи), ещё теснее —
     без вопроса; ответ не сжимается в ноль — хотя бы две строки и прокрутка */
  #cap .bot:not(:empty):not(.wait) { min-height: 2.84em; }
  #cap.tight { padding: 8px 12px; }
  #cap.tight .you { -webkit-line-clamp: 1; margin-bottom: 2px; }
  #cap.tight #act.fin { display: none; }
  #cap.tight2 .you { display: none; }
  #act { cursor: pointer; }
  #reader { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; padding: 12px 10px 10px 14px;
            background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--persona) 12%, transparent) 0%, transparent 55%), var(--skin-bg, #0d0d12); }
  #reader.on { display: flex; }
  #reader .rh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-right: 2px; }
  #reader .rh b { flex: 1; font: 600 14px "Unbounded", "Ubuntu", sans-serif; letter-spacing: .02em; }
  #rd-body { flex: 1; overflow-y: auto; padding-right: 6px; user-select: text; -webkit-user-select: text; cursor: auto;
             scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; font-size: calc(13.5px * var(--dw-text, 1)); line-height: 1.55; }
  #rd-body .q { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  #rd-body .q::before { content: "Вы: "; opacity: .75; }
  #rd-body h4 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.45); margin: 4px 0 8px; font-weight: 600; }
  .steps { list-style: none; margin: 0 0 14px; }
  .steps li { position: relative; padding: 0 0 10px 20px; }
  .steps li::before { content: ""; position: absolute; left: 3px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #4BE3A1; }
  .steps li.run::before { background: #D6E4F0; animation: blink 1s infinite; }
  .steps li.error::before { background: #ff8aa2; } .steps li.declined::before { background: rgba(255,255,255,.35); }
  .steps li::after { content: ""; position: absolute; left: 6.5px; top: 18px; bottom: 2px; width: 1px; background: rgba(255,255,255,.1); }
  .steps li:last-child::after { display: none; }
  .steps .st { font-weight: 600; font-size: 13px; }
  .steps .sd { font: 12px/1.45 ui-monospace, "Ubuntu Mono", monospace; color: #D6E4F0; word-break: break-word; margin-top: 2px; }
  .steps .se { color: #ff8aa2; font-size: 12px; margin-top: 2px; }
  .steps details { margin-top: 3px; } .steps summary { font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .steps pre, .md pre { margin: 6px 0; }
  .md p { margin: 0 0 8px; } .md ul, .md ol { margin: 0 0 8px 18px; } .md li { margin-bottom: 3px; }
  .md .h { display: block; font-weight: 700; margin: 10px 0 6px; color: #fff; }
  .md code { font: 12.5px ui-monospace, "Ubuntu Mono", monospace; background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; }
  pre { position: relative; background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; overflow-x: auto;
        font: 12px/1.5 ui-monospace, "Ubuntu Mono", monospace; white-space: pre; scrollbar-width: thin; }
  pre code { background: none !important; padding: 0 !important; }
  pre .cp { position: sticky; float: right; left: 100%; top: 0; margin: -4px -6px 0 8px; border: 0; border-radius: 8px; padding: 3px 8px;
            background: rgba(255,255,255,.1); color: var(--ink); font: 11px "Manrope", sans-serif; cursor: pointer; }
  pre .cp:hover { background: rgba(255,255,255,.18); }
  /* «Ответ целиком» и ход работы в светлых темах (№233, 24.10: «при нажатии „ответ целиком“ текст плохо различим» —
     тёмный лист #0d0d12 и тёмные чернила «Небесного»): лист — цвет темы, чернила, приглушённые линии и код */
  body.light #reader .rh b, body.light #rd-body { color: var(--ink); }
  body.light #rd-body { scrollbar-color: rgba(20,30,60,.22) transparent; }
  body.light #rd-body h4 { color: var(--muted); }
  body.light .md .h { color: var(--ink); }
  body.light .md code { background: rgba(20,30,60,.07); }
  body.light pre { background: rgba(20,30,60,.06); }
  body.light pre .cp { background: rgba(20,30,60,.08); } body.light pre .cp:hover { background: rgba(20,30,60,.14); }
  body.light .steps .sd { color: #3c4a64; } body.light .steps li.run::before { background: #6f8bb3; }
  body.light .steps li::after { background: rgba(20,30,60,.12); } body.light .steps li.declined::before { background: rgba(20,30,60,.3); }
  body.light .steps li.error::before { background: #d2486a; } body.light .steps .se { color: #b8304f; }
  body.light .steps li::before { background: #1f9d6a; }
  /* Подсказки кнопок — свои, внутри карточки (отзыв 17.10: системная подсказка у портрета вылезала за края виджета и
     обрезалась). title переезжает в data-tip при наведении; подсказка переносится по словам и не выходит за окно. */
  #htip { position: fixed; z-index: 99; max-width: calc(100vw - 20px); padding: 7px 11px; border-radius: 12px; pointer-events: none;
          background: rgba(14,14,18,.96); color: #ECEAF5; font: 500 12px/1.4 "Manrope", sans-serif; box-shadow: 0 10px 26px -10px rgba(0,0,0,.7);
          opacity: 0; transition: opacity .12s; }
  #htip.on { opacity: 1; }

#assistant-topbar{position:absolute;top:8px;left:96px;right:96px;height:30px;display:flex;align-items:center;gap:6px;z-index:7}
#assistant-topbar select{min-width:0;width:160px;max-width:52%;font:inherit;font-size:11px;color:var(--ink);border:0;border-radius:7px;background:transparent;padding:5px 2px;cursor:pointer}
#assistant-topbar #ask-model{position:static;transform:none;flex:1;min-width:20px;max-width:none;width:auto;font-size:10px}
#assistant-topbar #b-voice-inline{flex-shrink:0;width:26px;height:28px;padding:4px;border:0;background:transparent;color:var(--muted)}
#canvas-scope-status{display:block;font-size:11px;color:var(--muted);margin:4px 0}#canvas-scope-status[hidden],#canvas-scope-log[hidden]{display:none}#canvas-scope-log{max-height:110px;overflow:auto;font-size:12px}#canvas-scope-log p{margin:4px 0}
@media(min-width:300px) and (max-width:380px){#assistant-topbar select{max-width:42%}}
@media(max-width:299px){#assistant-topbar{gap:4px}#assistant-topbar #ask-model{display:none}#assistant-topbar select{flex:1;max-width:none}}
body.mini #assistant-topbar{display:none}
</style>
</head>
<body>
<div id="reader"><div class="rh"><b id="rd-title">Ответ целиком</b><button class="btn" id="rd-x" title="Закрыть (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="rd-body"></div></div>
<div id="card">
  <button id="ask-model" class="off" type="button" title="Выбрать модель" aria-label="Выбрать модель" aria-expanded="false" aria-controls="model-menu">Модель не подключена</button>
  <div id="model-menu" hidden role="group" aria-label="Выбор модели для общения"></div>
  <button id="bubble" hidden aria-hidden="true" title="Состояние режима ввода. Модель выбирается кнопкой в верхней строке." aria-label="Состояние режима ввода; модель выбирается отдельной кнопкой">
    <span id="say">Подключаюсь…</span>
  </button>
  <div id="orb" tabindex="0" role="button" title="Нажмите — выбрать помощника. Удерживайте — диктовка любой длины, отпустите — отправлю" aria-label="Выбрать помощника"><canvas id="cv"></canvas>
    <svg id="tarc" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><span id="tmini"></span></div>
  <div id="mid">
    <div id="cap"><div class="you" id="you"></div><div id="act" title="Ход работы"></div><div id="answer-row"><div class="bot" id="bot"></div><span id="run-status" role="status"></span><button class="ab" id="a-stop" title="Остановить ответ и текущую работу модели" aria-label="Остановить ответ"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button></div><div id="media"></div><button id="more">Открыть целиком</button></div>
    <div id="screenshot-messages" aria-label="Снимки в сообщениях ассистента"></div>
    <div id="yn"><button class="yes" id="y">Да</button><button id="n">Нет</button></div>
    <div id="note"></div><div id="ldbar"><i></i></div>
    <div id="health" title="Что сейчас с ассистентом"></div>
    <div id="tmr" aria-live="off"></div>
    <div id="rem"><span class="ri" id="rem-ico">⏰</span><span class="rt"><b id="rem-when"></b><span id="rem-text"></span></span><button id="rem-undo" title="Отменить напоминание">Отменить</button></div>
    <div id="task"></div>
    <div id="upd"></div>

  <template id="hud-help-content">
    <h3>Ввод и отправка</h3><p>Введите просьбу в нижнее поле. Enter добавляет строку, а Ctrl+Enter (⌘+Enter на Mac) отправляет сообщение. Кнопка со стрелкой тоже отправляет текст. Можно обращаться голосом к Лире. Название модели в центре верхней строки открывает выбор модели.</p>
    <h3>Голосовой ввод</h3><p>Нажмите микрофон и произнесите фразу. Нажатие квадрата останавливает запись и дожидается распознавания последних слов, оставляя текст в поле без отправки. Команда «Лира, стоп» останавливает запись. Обращение к помощнику с распознанной командой, например «Лира, скопировать», выполняется и не добавляется в текст. Пока Лира думает или отвечает, в области ответа видна кнопка остановки: она прерывает текущий ответ и не очищает черновик. Для завершения и отправки скажите в конце имя текущего помощника, например «Лира». Имя можно произнести отдельно.</p>
    <h3>Диктовка в другие приложения</h3><p>Включите микрофон, поставьте курсор в нужное поле и скажите «Лира, слушай» или «Лира, записывай». Продиктуйте текст и скажите «Лира, вставить», «Лира, добавить» или «Лира, текст». Текст заменит предыдущее содержимое буфера обмена; если подходящее поле активно, Лира также вставит текст в него, не отправляя сообщение. Если поле недоступно, текст останется в буфере для ручной вставки, а черновик — в диктовке. Лира продолжит слушать.</p><p>Когда окно Лиры открыто, черновик фоновой диктовки виден в отдельном поле и доступен для редактирования. Команда «Лира, текст» также копирует текст при диктовке через кнопку микрофона. «Лира, отмена» очищает фоновый черновик; «Лира, стоп» или «Лира, закончи диктовку» останавливает запись и сохраняет распознанный черновик. Одно имя показывает ассистента. Для автоматической вставки требуется разрешение «Универсальный доступ» в настройках macOS; защищённые поля не поддерживаются.</p>
    <h3>Текст и снимок экрана</h3><p>Меню обработки текста появляется, когда в поле есть текст. «Обработка текста» убирает слова-паразиты и повторы, склеивает очевидные продолжения фраз и исправляет явные опечатки по смыслу. Для контекстной правки используется подключённая модель; сомнительные слова и имена она должна сохранять. «Перевести» переводит выделенный фрагмент или весь черновик между русским и английским; направление определяется по алфавиту исходного текста. Скажите «Лира, перевод» или «Лира, перевести», чтобы запустить перевод. Кириллица ↔ латиница меняет раскладку. Действие применяется к выделенному тексту, а без выделения — ко всему черновику. Скажите «Лира, обработать» или «Лира, обработка», чтобы обработать текст. Для переключения текста скажите «Лира, кириллица» или «Лира, русский», либо «Лира, латиница» или «Лира, английский». Копирование сохраняет весь текст в буфер обмена. Скажите «Лира, скопировать» или «Лира, скопировать текст», чтобы скопировать весь текст без вставки; «Лира, вставить» или «Лира, вставить текст» также попробует вставить его в активное поле другого приложения. «Лира, сотри» или «Лира, очисти» удаляет выделение, а если выделения нет — весь черновик. Команды работают во время и после диктовки, пока включён голосовой режим. Блеклый значок снимка означает, что доступ к записи экрана не подтверждён; нажмите его, чтобы открыть настройки доступа.</p>
    <h3>Ссылки и файлы</h3><p>Вставка ссылки сама ничего не открывает и не запускает. Выберите действие в меню над полем или напишите, что сделать. Файл, папку или снимок экрана добавьте перед отправкой; проверьте вложения и выбранную модель.</p>
    <h3>Ответы и действия</h3><p>Во время ответа кнопка «Стоп» прекращает текущую работу. Кнопки в карточке результата открывают связанные материалы или задачи. Если ассистент просит подтвердить действие, сначала прочитайте его описание: «Да» подтверждает, «Нет» отменяет.</p>
    <h3>Почта</h3><p>Значок конверта в нижней панели показывает число непрочитанных писем. Нажмите его, чтобы открыть этот список. Отправка ответа доступна после просмотра точного текста и отдельного подтверждения.</p>
    <h3>Приватность</h3><p>Текст сообщения, ссылки и вложения могут передаваться выбранной модели для выполнения просьбы. Проверяйте содержимое перед отправкой.</p>
  </template>

/* Текст ошибки для человека: событие (не прочитался файл, не загрузилась картинка) — словами, а не «[object ProgressEvent]»

  if (e && typeof Event !== "undefined" && e instanceof Event) {
    const t = e.target || {}, err = t.error && t.error.name;
    return t instanceof FileReader ? "файл не прочитался" + (err ? ` (${err})` : "") + " — возможно, это папка, файл в облаке или занят другой программой"

  b.onclick = (ev) => { ev.stopPropagation(); b.disabled = true; b.textContent = "Отправляю…"; hideCapLater(60000);
    core.call("report_send", { note: "Ошибка в виджете: " + msg.slice(0, 300) })
      .then(r => { b.textContent = `Отчёт №${r.id} отправлен — спасибо!`; hideCapLater(6000); })
      .catch(err => core.call("report").then(p => { const d = p.split(/[\\/]/).slice(-2, -1)[0] || "";
        b.textContent = `Не отправился (${err.message.slice(0, 80)}) — сохранил в папку «${d}»`; b.title = p; }))
      .catch(err => { b.textContent = err.message; }); };
  $("bot").appendChild(b);
}

    + `<div class="tt"><b></b><span></span></div><button title="Отменить таймер" aria-label="Отменить таймер"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`).join("");

   кнопка перезапуска (api().restart_core). */

    if (sec < 8) return;

function applyDraftLayout(target, fromVoice, event) {
  $("a-text-menu-popup").hidden = true; $("a-text-menu").setAttribute("aria-expanded", "false");
  const t = $("askin"), range = fromVoice
    ? (t.selectionStart !== t.selectionEnd ? [t.selectionStart,t.selectionEnd] : null)
    : draftActionRange(event, t);
  const actualRange = range || (t.value.length ? [0,t.value.length] : null);
  if (!actualRange) {
    if (fromVoice) showVoiceCommand({action:target === "cyr" ? "layout_cyr" : "layout_lat",status:"error",message:"В поле нет текста."});
    return;
  }
  const latin = "qwertyuiopasdfghjklzxcvbnm", russian = "йцукенгшщзфывапролдячсмить";
  const source = t.value.slice(...actualRange);
  const converted = Array.from(source, letter => {
    const lower = letter.toLowerCase();
    let index, mapped;
    if (target === "lat") {
      index = russian.indexOf(lower); if (index < 0) return letter; mapped = latin[index];
    } else if (target === "cyr") {
      index = latin.indexOf(lower); if (index < 0) return letter; mapped = russian[index];
    } else {
      index = latin.indexOf(lower);
      if (index >= 0) mapped = russian[index];
      else { index = russian.indexOf(lower); if (index < 0) return letter; mapped = latin[index]; }
    }
    return letter !== lower ? mapped.toUpperCase() : mapped;
  }).join("");
  t.setRangeText(converted, actualRange[0], actualRange[1], "select");
  lastDictationSelection = null;
  fitAsk(); t.focus({preventScroll: true});
  $("ask-feedback").textContent = target === "cyr" ? "Текст переключён на кириллицу" : target === "lat" ? "Текст переключён на латиницу" : "Раскладка текста изменена";
  if (fromVoice) showVoiceCommand({action:target === "cyr" ? "layout_cyr" : "layout_lat",status:"done"});
}

/* ---------- ход работы и ответ целиком ---------- */
const TL = { you: "", steps: [], answer: "" };
const escR = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function mdLite(t) {
  const parts = String(t || "").split(/```/);
  return parts.map((p, i) => {
    if (i % 2) { const code = p.replace(/^[\w+-]*\n/, ""); return `<pre><button class="cp">Копировать</button><code>${escR(code.replace(/\n$/, ""))}</code></pre>`; }
    let h = escR(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
    const out = []; let list = null, num = 0;          // num — номер первого пункта нумерованного списка (0 — точки)
    const close = () => { if (list) out.push(num ? `<ol start="${num}">${list.join("")}</ol>` : `<ul>${list.join("")}</ul>`); list = null; };
    for (const line of h.split("\n")) {
      const li = line.match(/^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/), hd = line.match(/^\s*#{1,6}\s+(.*)$/);
      if (li) { const n = li[1] ? +li[1] : 0; if (list && !n !== !num) close(); if (!list) { list = []; num = n; } list.push(`<li>${li[2]}</li>`); continue; }
      close();
      if (hd) out.push(`<span class="h">${hd[1]}</span>`);
      else if (line.trim()) out.push(`<p>${line}</p>`);
    }
    close();
    return out.join("");
  }).join("");
}
function tlReset(you) { TL.you = you || ""; TL.steps = []; TL.answer = ""; TL.media = null; moreBtn(); }

<script>
(function () {                                  // подсказки кнопок внутри карточки (см. #htip в стилях)
  const tip = document.getElementById("htip"); let cur = null, timer = 0;
  const hide = () => { clearTimeout(timer); tip.classList.remove("on"); cur = null; };
  document.addEventListener("mouseover", (e) => {
    const el = e.target.closest && e.target.closest("[title], [data-tip]");
    if (!el || el === cur) return;
    if (el.hasAttribute("title")) { el.dataset.tip = el.getAttribute("title"); el.removeAttribute("title"); }
    if (!el.dataset.tip) return;
    hide(); cur = el;
    timer = setTimeout(() => {
      if (cur !== el || !el.isConnected) return;
      tip.textContent = el.dataset.tip;
      const r = el.getBoundingClientRect(), w = Math.min(tip.offsetWidth, innerWidth - 20), h = tip.offsetHeight;
      const x = Math.max(10, Math.min(innerWidth - w - 10, r.left + r.width / 2 - w / 2));
      const y = r.bottom + 8 + h <= innerHeight - 6 ? r.bottom + 8 : Math.max(6, r.top - h - 8);
      tip.style.left = x + "px"; tip.style.top = y + "px"; tip.classList.add("on");
    }, 550);
  });
  document.addEventListener("mouseout", (e) => { if (cur && !cur.contains(e.relatedTarget)) hide(); });
  ["mousedown", "wheel", "keydown", "blur"].forEach(k => addEventListener(k, hide, true));

</script>

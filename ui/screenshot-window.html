<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dewiar — Снимок экрана</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="assets/screenshot-picker.css">
<style>:root{--ink:#eef2ff;--muted:#b8c1d7;--panel:#20232e;--accent:#626ce3;--line:rgba(128,140,180,.25)}@media(prefers-color-scheme:light){:root{--ink:#24324a;--muted:#596780;--panel:#f3f6fc}}</style></head>
<body class="ss-window"><header class="ss-dialog-bar"><h1 id="ss-title">Снимок экрана</h1><button id="ss-close" type="button">Закрыть</button></header><main id="ss-content"></main>
<script src="assets/dewiar.js"></script><script src="assets/screenshot-picker.js"></script>
<script>
const params = new URLSearchParams(location.search), mode = params.get('mode'), id = params.get('id');
let started = false, cleanup = null;
const close = () => { cleanup?.(); const native = window.api?.(); if (native?.close_screenshot_window) native.close_screenshot_window(); else window.close(); };
document.getElementById('ss-close').onclick = close;
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
async function start() {
  if (started) return; started = true;
  const host = document.getElementById('ss-content');
  if (mode === 'region') { document.getElementById('ss-title').textContent = 'Выберите часть экрана'; cleanup = await DewiarCapture.regionEditor(host, id, close); }
  else await DewiarCapture.viewer(host, id);
}
core.on('hello', start); if (core.snapshot) start();
</script></body></html>

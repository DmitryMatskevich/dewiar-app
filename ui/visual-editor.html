<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dewiar — Пометки на снимке</title><link rel="stylesheet" href="assets/visual-editor.css"></head><body>
<header><strong>Пометки на снимке</strong><button id="copy">Скопировать PNG</button><button id="save-as">Сохранить копию</button><button id="note">В заметки</button><button id="task">В задачу…</button><button id="to-canvas">На холст…</button><button id="original">Оригинал</button></header>
<nav id="tools" aria-label="Инструменты"></nav>
<section class="props"><label>Цвет <select id="color"><option value="#e5484d">Красный</option><option value="#f08c00">Оранжевый</option><option value="#ffd43b">Жёлтый</option><option value="#2f9e44">Зелёный</option><option value="#1971c2">Синий</option><option value="#000000">Чёрный</option></select></label><label>Толщина <select id="width"><option value="2">Тонкая</option><option value="4" selected>Средняя</option><option value="8">Толстая</option></select></label><button id="undo">Отменить</button><button id="redo">Повторить</button><button id="delete">Удалить пометку</button><button id="crop">Обрезать…</button><button id="reset">Сбросить пометки</button></section>
<form id="command-form" class="command-bar"><label for="command-input">Команда</label><input id="command-input" maxlength="2000" placeholder='Обведи «Сохранить» красным' autocomplete="off"><button id="command-mic" disabled type="button" title="Диктовка команды, до двух минут. Требуется включённый голосовой режим Dewiar.">Продиктовать</button><button id="command-run" disabled type="submit">Выполнить</button><button id="private-find" disabled type="button">Скрыть личное…</button></form>
<main id="area" aria-label="Редактор снимка"></main><footer><button id="fit">Уместить</button><button id="full">100%</button><span id="status" role="status">Открываю снимок…</span></footer>
<dialog id="canvas-dialog"><h2>Поместить готовый PNG на холст</h2><select id="canvas-target" aria-label="Холст"></select><button id="canvas-send">Добавить и открыть</button><button id="canvas-cancel">Отмена</button></dialog>
<dialog id="crop-dialog"><h2>Обрезка в пикселях исходника</h2><p>Для выбора мышью сначала нарисуйте и выделите рамку. Её координаты появятся здесь. Обрезка применяется к готовому PNG.</p><div id="crop-fields"></div><button id="crop-apply">Применить</button><button id="crop-clear">Весь снимок</button><button id="crop-close">Отмена</button></dialog>
<dialog id="task-dialog"><h2>Передать снимок в задачу</h2><label>Задача <select id="task-target"><option value="">Новая задача</option></select></label><p><label>Что сделать <input id="task-text" value="Разобрать помеченную область снимка"></label></p><button id="task-send">Отправить и начать</button><button id="task-close">Отмена</button></dialog>
<dialog id="close-dialog"><h2>Не удалось сохранить</h2><p id="close-error"></p><button id="close-retry">Повторить</button><button id="close-stay">Остаться</button><button id="close-discard">Закрыть без сохранения</button></dialog>
<dialog id="command-dialog"><h2 id="command-title"></h2><p id="command-description"></p><canvas id="command-preview" aria-label="Найденные области на исходном снимке"></canvas><div id="command-options"></div><div class="command-actions"><button id="command-apply">Применить выбранное</button><button id="command-cancel">Отмена</button></div></dialog>
<script src="assets/dewiar.js"></script><script src="assets/vendor/markerjs3.min.js"></script><script src="assets/visual-commands.js"></script><script src="assets/visual-editor.js"></script></body></html>
